# One Argo CD Application per environment directory. Unlike the rendered
# variant, each Application syncs its Kustomize overlay directly from main —
# Kargo promotes by committing an image-tag bump to the overlay on main.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: rollouts-app
  namespace: argocd
spec:
  # Go templating (rather than fasttemplate, used by the other apps in this
  # repo) so the destination can vary by stage below -- prod runs on its own
  # workload cluster instead of the shared demo1 used by dev/staging.
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://github.com/adamancini/akp-platform.git
      revision: HEAD
      directories:
      - path: apps/rollouts-app/env/*
  template:
    metadata:
      name: 'rollouts-app-{{.path.basename}}'
      annotations:
        # Authorizes the matching Kargo Stage to manage/sync this Application.
        kargo.akuity.io/authorized-stage: 'rollouts-app:{{.path.basename}}'
    spec:
      project: rollouts-app
      source:
        repoURL: https://github.com/adamancini/akp-platform.git
        targetRevision: HEAD
        path: '{{.path.path}}'
      destination:
        # prod is isolated on its own workload cluster (demo2); dev/staging
        # stay on the shared demo1 cluster used by every other app here.
        name: '{{- if eq .path.basename "prod" }}demo2{{- else }}demo1{{- end }}'
        # ...or specify a server address instead:
        # server: https://REPLACEME
